<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estacionamiento CABA</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #ffffff; --fg: #1d2330; --muted: #5d6677; --line: #d9dde5; --panel: #ffffffee;
    --ok: #1f9d55; --mid: #e0a100; --bad: #d64545; --none: #9aa1ad; --accent: #2457d6;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151922; --fg: #e8ebf2; --muted: #a2aab9; --line: #2e3544; --panel: #1b2030ee; --accent: #7da2ff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  #map { position: absolute; inset: 0; }
  [hidden] { display: none !important; }

  .glass { position: absolute; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(10px); box-shadow: 0 4px 18px #0003; }
  button, select { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; min-height: 44px; padding: 0 14px; cursor: pointer; }
  button:active { transform: scale(.98); }

  /* pestañas */
  #tabs { top: calc(12px + var(--safe-t)); left: 12px; padding: 3px; display: flex; gap: 2px; border-radius: 999px; }
  #tabs button { border: 0; background: transparent; border-radius: 999px; min-height: 40px; padding: 0 16px; font-weight: 600; font-size: 15px; }
  #tabs button.on { background: var(--accent); color: #fff; }

  /* botón de ubicación */
  #fab { top: calc(60px + var(--safe-t)); right: 12px; width: 48px; height: 48px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
  #fab svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 2; }

  #fab.need { background: var(--accent); }
  #fab.need svg { stroke: #fff; }
  #geoHelp { top: calc(116px + var(--safe-t)); left: 12px; right: 12px; max-width: 420px; padding: 12px 14px; z-index: 9; font-size: 14px; line-height: 1.4; }
  .geoBtns { display: flex; gap: 8px; margin-top: 10px; }
  .geoBtns button { flex: 1; min-height: 44px; }

  /* barra inferior */
  .dock { left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); max-width: 520px; padding: 12px; max-height: calc(100dvh - 130px - var(--safe-t) - var(--safe-b)); overflow-y: auto; }
  #timebar { display: flex; align-items: center; gap: 10px; }
  #timebar select { padding: 0 8px; }
  #hour { flex: 1; height: 36px; accent-color: var(--accent); min-width: 0; }
  #hourLabel { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
  #now { min-height: 36px; padding: 0 12px; font-size: 14px; color: var(--accent); }

  /* relevamiento */
  #rvTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #rvCount { font-weight: 700; font-size: 15px; }
  #rvMore { width: 44px; padding: 0; font-size: 22px; line-height: 1; }
  #rvInfo { font-size: 14px; color: var(--muted); margin-bottom: 8px; line-height: 1.35; }
  #rvInfo:empty { display: none; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; min-height: 54px; font-weight: 700; border-radius: 14px; }
  .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #rvMenu { margin-top: 10px; display: grid; gap: 6px; }
  #rvMenu button { text-align: left; min-height: 44px; }
  #rvMenu label { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 0 4px; font-size: 15px; }
  #rvMenu input { width: 20px; height: 20px; accent-color: var(--accent); }
  #rvMenu .note { font-size: 12px; color: var(--muted); line-height: 1.35; padding: 2px 4px; }

  /* pregunta de cada cuadra */
  #rvPrompt { z-index: 8; border: 2px solid var(--accent); }
  #rvPrompt h2 { font-size: 19px; margin: 0 0 2px; }
  #rvSub { font-size: 14px; color: var(--muted); margin-bottom: 12px; min-height: 1.2em; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid button { min-height: 62px; font-size: 24px; font-weight: 700; padding: 0; }
  .grid button.small { font-size: 14px; line-height: 1.15; }
  #rvSkip { width: 100%; margin-top: 8px; border: 0; background: transparent; color: var(--muted); min-height: 44px; }

  /* aviso breve */
  #toast { position: absolute; z-index: 9; left: 50%; top: calc(112px + var(--safe-t)); transform: translateX(-50%); background: #1d2330ee; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

  /* popup del mapa */
  .maplibregl-popup-content { background: var(--bg); color: var(--fg); border-radius: 14px; padding: 12px; box-shadow: 0 4px 18px #0004; }
  .maplibregl-popup-tip { display: none; }
  .maplibregl-popup-close-button { font-size: 20px; padding: 4px 10px; color: var(--muted); }
  .pop h3 { margin: 0 24px 10px 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .pop .btns { display: flex; gap: 6px; }
  .pop .btns button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 14px; }

  .me { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--accent), 0 1px 6px #0006; }
</style>
</head>
<body>
<div id="map"></div>

<div id="tabs" class="glass"><button id="tab-mapa" class="on">Mapa</button><button id="tab-rel">Relevamiento</button></div>
<button id="fab" class="glass" aria-label="Mi ubicación"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button>
<div id="toast" hidden></div>
<div id="geoHelp" class="glass" hidden>
  <div id="geoMsg"></div>
  <div class="geoBtns"><button id="geoRetry" class="primary">Reintentar</button><button id="geoClose">Cerrar</button></div>
</div>

<div id="timebar" class="glass dock">
  <select id="day" aria-label="Día">
    <option value="auto">Hoy</option>
    <option value="wd">Hábil</option>
    <option value="sat">Sábado</option>
    <option value="sun">Domingo</option>
  </select>
  <input type="range" id="hour" min="0" max="23" step="1" aria-label="Hora">
  <span id="hourLabel"></span>
  <button id="now" hidden>Ahora</button>
</div>

<div id="relev" class="glass dock" hidden>
  <div id="rvTop"><span id="rvCount"></span><button id="rvMore" aria-label="Más opciones">⋯</button></div>
  <div id="rvInfo"></div>
  <div class="actions">
    <button id="rvManual" hidden>Terminé la cuadra</button>
    <button id="rvStart" class="primary">Empezar</button>
  </div>
  <div id="rvMenu" hidden>
    <label><input type="checkbox" id="rvCompanion"> Voy a pie o de acompañante</label>
    <button id="rvUndo">Deshacer la última</button>
    <button id="rvCsv">Exportar CSV</button>
    <button id="rvClear">Borrar todo</button>
    <button id="rvSim">Probar con recorrido simulado</button>
    <div class="note">Si manejás solo, no uses el teléfono en movimiento: sin la casilla, las preguntas esperan a que frenes.</div>
  </div>
</div>

<div id="rvPrompt" class="glass dock" hidden>
  <h2>¿Cuántos lugares libres?</h2>
  <div id="rvSub"></div>
  <div class="grid">
    <button data-v="0">0</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
    <button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6+</button><button data-v="np" class="small">No se puede</button>
  </div>
  <button id="rvSkip" data-v="skip">Omitir</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ================= Configuración =================
const FALLBACK_CENTER = [-58.3955, -34.5908];   // Recoleta, si no hay ubicación
const REPORT_TTL_MS = 15 * 60 * 1000;
const COLORS = { ok: '#1f9d55', mid: '#e0a100', bad: '#d64545', none: '#9aa1ad' };
const PARKABLE = ['primary', 'secondary', 'tertiary', 'minor'];   // calles donde se estaciona (sin autopistas, servicios ni peatonales)
const AVENUES = ['primary', 'secondary'];   // proxy de "avenida": regla 2023 → no se estaciona 7–21 hábiles
const MAX_KNOWN = 40000;

// ================= Mapa base minimalista =================
// Solo fondo, agua, parques, edificios tenues, calles en gris y nombres de calles.
const baseStyle = {
  version: 8,
  glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources: { omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' } },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#e9ecf0' } },
    { id: 'park', type: 'fill', source: 'omt', 'source-layer': 'park', paint: { 'fill-color': '#dde7da' } },
    { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': '#cddbea' } },
    { id: 'building', type: 'fill', source: 'omt', 'source-layer': 'building', minzoom: 15, paint: { 'fill-color': '#dfe2e8', 'fill-opacity': 0.8 } },
    { id: 'roads-fast', type: 'line', source: 'omt', 'source-layer': 'transportation',
      filter: ['in', ['get', 'class'], ['literal', ['motorway', 'trunk']]],
      paint: { 'line-color': '#d0d4dc', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1, 18, 7] } },
    { id: 'roads', type: 'line', source: 'omt', 'source-layer': 'transportation',
      filter: ['in', ['get', 'class'], ['literal', PARKABLE]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#f7f8fa', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1, 18, 14] } },
    { id: 'street-names', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 15.5,
      filter: ['in', ['get', 'class'], ['literal', PARKABLE]],
      layout: { 'symbol-placement': 'line', 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'], 'text-size': 11 },
      paint: { 'text-color': '#6b7383', 'text-halo-color': '#f7f8fa', 'text-halo-width': 1.5 } }
  ]
};

const map = new maplibregl.Map({ container: 'map', style: baseStyle, center: FALLBACK_CENTER, zoom: 16, attributionControl: false });
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-right');
// la atribución queda cerrada (botón "i") para no tapar las pestañas
function closeAttribution() { const a = document.querySelector('.maplibregl-ctrl-attrib'); if (a) { a.classList.remove('maplibregl-compact-show'); a.removeAttribute('open'); } }
closeAttribution();
map.once('load', () => { closeAttribution(); setTimeout(closeAttribution, 800); });

// ================= Estado =================
const $ = id => document.getElementById(id);
const known = new Map();
const colored = new Set();
let reports = loadReports();
let following = false;
let meMarker = null;
let mode = 'mapa';

function loadReports() { try { return JSON.parse(localStorage.getItem('reports') || '{}'); } catch { return {}; } }
function saveReports() { try { localStorage.setItem('reports', JSON.stringify(reports)); } catch {} }
function fmtHour(h) { return String(h).padStart(2, '0') + ':00'; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let toastT = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500); }

// ================= Modelo SIMULADO (hipótesis, no datos reales) =================
function baseOccupancy(hour, dayType) {
  if (dayType === 'wd') {
    if (hour < 6) return 0.40;
    if (hour < 8) return 0.40 + (hour - 6) * 0.20;
    if (hour < 19) return 0.88;
    if (hour < 22) return 0.72;
    return 0.50;
  }
  if (dayType === 'sat') { if (hour < 9) return 0.40; if (hour < 14) return 0.78; if (hour < 21) return 0.68; return 0.50; }
  if (hour < 10) return 0.35; if (hour < 20) return 0.55; return 0.45;
}
function hash01(n) { const x = Math.sin((n % 1000003) * 12.9898) * 43758.5453; return x - Math.floor(x); }
function currentSim() {
  let day = $('day').value;
  if (day === 'auto') { const d = new Date().getDay(); day = d === 0 ? 'sun' : d === 6 ? 'sat' : 'wd'; }
  return { hour: +$('hour').value, dayType: day };
}
function evaluate(id, cls, sim) {
  if (AVENUES.includes(cls)) {
    const allowed = sim.dayType === 'wd' ? (sim.hour >= 21 || sim.hour < 7) : true;
    if (!allowed) return { color: COLORS.none };
  }
  const occ = Math.min(0.98, Math.max(0.10, baseOccupancy(sim.hour, sim.dayType) + (hash01(id) - 0.5) * 0.5));
  const p = 1 - occ;
  const rep = reports[id];
  if (rep && Date.now() - rep.ts < REPORT_TTL_MS) return { color: rep.type === 'no' ? COLORS.bad : COLORS.ok };
  if (p >= 0.25) return { color: COLORS.ok };
  if (p >= 0.10) return { color: COLORS.mid };
  return { color: COLORS.bad };
}

// ================= Pintado de las calles (por tramo, con feature-state) =================
let pending = false, forceAll = false;
function scheduleColorize(force) {
  if (force) forceAll = true;
  if (pending) return;
  pending = true;
  setTimeout(() => { pending = false; colorize(); }, 60);
}
function colorize() {
  if (!map.getLayer('calles-color')) return;
  const sim = currentSim();
  $('hourLabel').textContent = fmtHour(sim.hour);
  $('now').hidden = $('day').value === 'auto' && sim.hour === new Date().getHours();
  if (known.size > MAX_KNOWN) { map.removeFeatureState({ source: 'omt', sourceLayer: 'transportation' }); known.clear(); colored.clear(); forceAll = true; }

  const fs = map.querySourceFeatures('omt', { sourceLayer: 'transportation', filter: ['in', ['get', 'class'], ['literal', PARKABLE]] });
  for (const f of fs) {
    if (f.id === undefined) continue;
    if (!known.has(f.id)) known.set(f.id, { cls: f.properties.class });
  }
  if (forceAll) {
    for (const [id, v] of known) map.setFeatureState({ source: 'omt', sourceLayer: 'transportation', id }, { color: evaluate(id, v.cls, sim).color });
    colored.clear(); for (const id of known.keys()) colored.add(id);
  } else {
    for (const f of fs) {
      if (f.id === undefined || colored.has(f.id)) continue;
      map.setFeatureState({ source: 'omt', sourceLayer: 'transportation', id: f.id }, { color: evaluate(f.id, f.properties.class, sim).color });
      colored.add(f.id);
    }
  }
  forceAll = false;
}

map.on('load', () => {
  map.addLayer({
    id: 'calles-color', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 13,
    filter: ['all', ['in', ['get', 'class'], ['literal', PARKABLE]], ['!=', ['get', 'brunnel'], 'tunnel']],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': ['coalesce', ['feature-state', 'color'], 'rgba(0,0,0,0)'], 'line-opacity': 0.95,
             'line-width': ['interpolate', ['linear'], ['zoom'], 13, 2, 18, 9] }
  }, 'street-names');
  map.on('click', 'calles-color', onClickStreet);
  map.on('mouseenter', 'calles-color', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'calles-color', () => map.getCanvas().style.cursor = '');
  initReleveLayers();
  setMode(mode);
  scheduleColorize(true);
  // se pide la ubicación al abrir; si no se pudo, el botón queda resaltado para tocarlo
  $('fab').classList.add('need');
  locate(false);
  try { navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'denied') showGeoHelp('denied'); }); } catch {}
});
map.on('sourcedata', e => { if (e.sourceId === 'omt' && e.isSourceLoaded) scheduleColorize(); });
map.on('moveend', () => scheduleColorize());
map.on('idle', () => scheduleColorize());
map.on('dragstart', () => { following = false; });

// ================= Popup del mapa =================
function streetNameNear(point, cls, id) {
  const nf = map.querySourceFeatures('omt', { sourceLayer: 'transportation_name', filter: ['has', 'name'] });
  const byId = nf.find(f => f.id === id);
  if (byId) return byId.properties.name;
  let best = null, bestD = 14;
  for (const f of nf) {
    if (f.properties.class !== cls) continue;
    const lines = f.geometry.type === 'MultiLineString' ? f.geometry.coordinates : [f.geometry.coordinates];
    for (const line of lines) for (let i = 0; i < line.length - 1; i++) {
      const d = distToSeg(point, map.project(line[i]), map.project(line[i + 1]));
      if (d < bestD) { bestD = d; best = f.properties.name; }
    }
  }
  return best;
}
function distToSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  let t = l2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
let popup = null;
function onClickStreet(e) {
  if (mode !== 'mapa') return;
  const f = e.features[0];
  const id = f.id, cls = f.properties.class;
  const color = evaluate(id, cls, currentSim()).color;
  const name = streetNameNear(e.point, cls, id) || 'Calle';
  const html = `<div class="pop"><h3><span class="dot" style="background:${color}"></span>${escapeHtml(name)}</h3>
    <div class="btns"><button onclick="sendReport(${id},'hay')">Hay lugar</button><button onclick="sendReport(${id},'sale')">Me voy</button><button onclick="sendReport(${id},'no')">No hay</button></div></div>`;
  if (popup) popup.remove();
  popup = new maplibregl.Popup({ maxWidth: '300px', offset: 8 }).setLngLat(e.lngLat).setHTML(html).addTo(map);
}
function sendReport(id, type) {
  reports[id] = { type, ts: Date.now() };
  for (const k of Object.keys(reports)) if (Date.now() - reports[k].ts > REPORT_TTL_MS) delete reports[k];
  saveReports();
  if (popup) popup.remove();
  scheduleColorize(true);
}

// ================= Ubicación =================
let watchId = null, locating = false;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
function showGeoHelp(kind) {
  const steps = IS_IOS
    ? 'En Safari tocá “aA” → Configuración del sitio web → Ubicación → Permitir. Si no aparece, en Ajustes del iPhone → Privacidad y seguridad → Localización, activala.'
    : 'En Chrome tocá el candado junto a la dirección → Permisos → Ubicación → Permitir. Y revisá que la ubicación (GPS) del teléfono esté activada.';
  $('geoMsg').textContent = kind === 'denied' ? 'La ubicación está bloqueada. ' + steps : kind === 'unsupported' ? 'Este navegador no permite usar la ubicación.' : 'No pude ubicarte. Revisá que el GPS esté activado y probá de nuevo, de preferencia al aire libre.';
  $('geoHelp').hidden = false;
}
function hideGeoHelp() { $('geoHelp').hidden = true; }
function startWatch() {
  if (watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(p => onFix(p, false), () => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}
// userTap = true cuando lo pide la persona con un toque (si falla, se lo explicamos)
function locate(userTap) {
  if (!navigator.geolocation) { if (userTap) showGeoHelp('unsupported'); return; }
  if (locating) return;
  locating = true;
  const done = () => { locating = false; };
  const ok = pos => { done(); hideGeoHelp(); onFix(pos, true); startWatch(); };
  const giveUp = err => { done(); if (err.code === 1) showGeoHelp('denied'); else if (userTap) showGeoHelp('fail'); };
  // primero con GPS preciso; si tarda o falla, con ubicación aproximada (wifi/antenas)
  navigator.geolocation.getCurrentPosition(ok, err => {
    if (err.code === 1) return giveUp(err);
    navigator.geolocation.getCurrentPosition(ok, giveUp, { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 });
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 10000 });
}
function onFix(pos, jump) {
  $('fab').classList.remove('need');
  const ll = [pos.coords.longitude, pos.coords.latitude];
  if (!meMarker) { const el = document.createElement('div'); el.className = 'me'; meMarker = new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(map); }
  else meMarker.setLngLat(ll);
  if (SV.active && !SV.sim) surveyFix(pos.coords);
  if (jump) { following = true; map.jumpTo({ center: ll, zoom: 16.5 }); }
  else if (following) map.easeTo({ center: ll, duration: 800 });
}

// ================= Relevamiento =================
// Caminando o de acompañante, el GPS detecta cuándo pasás por una esquina; al llegar a la siguiente
// pregunta cuántos lugares libres había en esa cuadra. Una "esquina" es un punto donde se cruzan dos calles.
const SV = { active: false, graph: null, last: null, speed: 0, path: 0, lastI: null, queue: [], prompt: null, asked: new Map(), sim: null, simT: 0, wake: null, acc: null };
let obs = loadObs();
function loadObs() { try { return JSON.parse(localStorage.getItem('obs') || '[]'); } catch { return []; } }
function saveObs() { try { localStorage.setItem('obs', JSON.stringify(obs)); } catch { toast('No se pudo guardar: exportá el CSV y liberá espacio'); } }

const toRad = Math.PI / 180;
function mdist(a, b) { const dx = (b[0] - a[0]) * Math.cos((a[1] + b[1]) / 2 * toRad) * 111320, dy = (b[1] - a[1]) * 110540; return Math.hypot(dx, dy); }
function distToPolyline(p, coords) {
  let best = Infinity; const k = Math.cos(p[1] * toRad) * 111320, ky = 110540;
  for (let i = 0; i < coords.length - 1; i++) {
    const ax = (coords[i][0] - p[0]) * k, ay = (coords[i][1] - p[1]) * ky, bx = (coords[i + 1][0] - p[0]) * k, by = (coords[i + 1][1] - p[1]) * ky;
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? -(ax * dx + ay * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
function polyLen(c) { let s = 0; for (let i = 0; i < c.length - 1; i++) s += mdist(c[i], c[i + 1]); return s; }
const vkey = c => Math.round(c[0] * 1e5) + ',' + Math.round(c[1] * 1e5);
function linesOf(g) { return g.type === 'MultiLineString' ? g.coordinates : g.type === 'LineString' ? [g.coordinates] : []; }

function buildGraph(center) {
  const fs = map.querySourceFeatures('omt', { sourceLayer: 'transportation',
    filter: ['all', ['in', ['get', 'class'], ['literal', PARKABLE]], ['!=', ['get', 'brunnel'], 'tunnel']] });
  const D = 0.004;
  const near = c => Math.abs(c[0] - center[0]) < D && Math.abs(c[1] - center[1]) < D;
  const lines = [], ids = new Map();
  for (const f of fs) {
    if (f.id === undefined) continue;
    for (const l of linesOf(f.geometry)) {
      if (!l.some(near)) continue;
      lines.push({ fid: f.id, c: l });
      for (const v of l) { const k = vkey(v); let s = ids.get(k); if (!s) { s = new Set(); ids.set(k, s); } s.add(f.id); }
    }
  }
  const inters = [];
  for (const [k, s] of ids) {
    if (s.size < 2) continue;
    const [x, y] = k.split(',').map(Number);
    const pt = [x / 1e5, y / 1e5];
    if (near(pt)) inters.push({ key: k, pt, fids: s });
  }
  return { center, t: Date.now(), lines, inters };
}
function ensureGraph(p) {
  if (!SV.graph || mdist(SV.graph.center, p) > 150 || Date.now() - SV.graph.t > 15000) SV.graph = buildGraph(p);
  return SV.graph;
}
function nameAt(pt, maxM, preferFid) {
  const nf = map.querySourceFeatures('omt', { sourceLayer: 'transportation_name', filter: ['has', 'name'] });
  let best = null, bd = maxM;
  for (const f of nf) for (const l of linesOf(f.geometry)) {
    const d = distToPolyline(pt, l) - (f.id === preferFid ? 3 : 0);
    if (d < bd) { bd = d; best = f.properties.name; }
  }
  return best;
}
function crossName(I, fid) {
  for (const other of I.fids) {
    if (other === fid) continue;
    for (const L of SV.graph.lines) {
      if (L.fid !== other || !L.c.some(v => vkey(v) === I.key)) continue;
      const q = L.c.find(v => { const d = mdist(v, I.pt); return d >= 15 && d <= 80; }) || L.c[0];
      const n = nameAt(q, 8, other);
      if (n) return n;
    }
  }
  return null;
}

function surveyFix(c) {
  const p = [c.longitude, c.latitude], now = c.ts || Date.now();
  if (c.accuracy && c.accuracy > 45) { SV.acc = 'Señal GPS débil, esperá un momento'; renderInfo(); return; }
  SV.acc = null;
  if (SV.last) {
    const d = mdist(SV.last.p, p), dt = (now - SV.last.t) / 1000;
    if (dt > 0) { const v = (c.speed != null && !isNaN(c.speed)) ? c.speed : d / dt; SV.speed = 0.6 * SV.speed + 0.4 * v; }
    if (d > 2) SV.path += d;
  }
  SV.last = { p, t: now };
  const g = ensureGraph(p);
  let best = null, bd = 18;
  for (const I of g.inters) { const d = mdist(I.pt, p); if (d < bd) { bd = d; best = I; } }
  if (best && (!SV.lastI || SV.lastI.key !== best.key)) {
    if (SV.lastI) tryClose(SV.lastI, best);
    SV.lastI = best; SV.path = 0;
  }
  pumpPrompts();
  renderInfo();
}
function tryClose(A, B) {
  const common = [...A.fids].filter(f => B.fids.has(f));
  const straight = mdist(A.pt, B.pt);
  if (!common.length || straight < 30 || straight > 350) return;
  if (SV.path > straight * 1.7 + 50) return;
  enqueue(A, B, common[0]);
}
function enqueue(A, B, fid, manual) {
  const key = [A.key, B.key].sort().join('|');
  const prev = SV.asked.get(key);
  if (!manual && prev && Date.now() - prev < 30 * 60 * 1000) return;
  SV.asked.set(key, Date.now());
  const mid = [(A.pt[0] + B.pt[0]) / 2, (A.pt[1] + B.pt[1]) / 2];
  let street = null, from = null, to = null;
  try { street = nameAt(mid, 15, fid); if (!manual) { from = crossName(A, fid); to = crossName(B, fid); } } catch {}
  SV.queue.push({ key, A, B, fid, street: street || 'Calle sin nombre', from, to, len: mdist(A.pt, B.pt), manual: !!manual });
  pumpPrompts();
}

// ---- Preguntas ----
function isMoving() { return !$('rvCompanion').checked && SV.speed > 4; }   // > ~14 km/h
function pumpPrompts() {
  if (SV.prompt || !SV.queue.length || isMoving()) return;
  SV.prompt = SV.queue.shift();
  const P = SV.prompt;
  $('rvSub').textContent = P.street + (P.from && P.to ? ` · entre ${P.from} y ${P.to}` : P.from || P.to ? ` · desde ${P.from || P.to}` : '');
  $('rvPrompt').hidden = false;
  $('relev').hidden = true;
  renderInfo();
}
function answer(v) {
  const P = SV.prompt;
  if (!P) return;
  SV.prompt = null;
  $('rvPrompt').hidden = true;
  $('relev').hidden = mode !== 'rel';
  if (v !== 'skip') {
    const d = new Date();
    obs.push({ ts: d.toISOString(), dia: ['dom', 'lun', 'mar', 'mie', 'jue', 'vie', 'sab'][d.getDay()], hora: d.getHours(),
      calle: P.street, entre_a: P.from || '', entre_b: P.to || '',
      lugares_libres: v === 'np' ? '' : (v === '6' ? 6 : +v), mas_de_6: v === '6' ? 1 : 0, estado: v === 'np' ? 'no_se_puede_estacionar' : 'ok',
      desde_lng: P.A.pt[0], desde_lat: P.A.pt[1], hasta_lng: P.B.pt[0], hasta_lat: P.B.pt[1], largo_m: Math.round(P.len), manual: P.manual ? 1 : 0, modo: $('rvCompanion').checked ? 'pie_o_acompanante' : 'auto' });
    saveObs();
  }
  renderReleve();
  setTimeout(pumpPrompts, 150);
}
document.querySelectorAll('#rvPrompt button').forEach(b => b.addEventListener('click', () => answer(b.dataset.v)));

function renderInfo() {
  $('rvCount').textContent = obs.length === 1 ? '1 cuadra' : obs.length + ' cuadras';
  let t = '';
  if (SV.active) {
    if (SV.acc) t = SV.acc;
    else if (SV.queue.length && isMoving()) t = `${SV.queue.length} en espera: respondé cuando frenes`;
    else if (!SV.lastI) t = 'Caminá hasta la primera esquina';
  }
  $('rvInfo').textContent = t;
  $('rvStart').textContent = SV.active ? 'Detener' : 'Empezar';
  $('rvStart').classList.toggle('primary', !SV.active);
  $('rvManual').hidden = !SV.active;
}
function renderReleve() {
  renderInfo();
  const src = map.getSource && map.getSource('releve');
  if (!src) return;
  src.setData({ type: 'FeatureCollection', features: obs.map(o => ({ type: 'Feature',
    properties: { color: o.estado !== 'ok' ? COLORS.none : o.lugares_libres === 0 ? COLORS.bad : o.lugares_libres <= 2 ? COLORS.mid : COLORS.ok },
    geometry: { type: 'LineString', coordinates: [[o.desde_lng, o.desde_lat], [o.hasta_lng, o.hasta_lat]] } })) });
}
function initReleveLayers() {
  map.addSource('releve', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'releve-lines', type: 'line', source: 'releve', layout: { 'line-cap': 'round', visibility: 'none' },
    paint: { 'line-color': ['get', 'color'], 'line-width': ['interpolate', ['linear'], ['zoom'], 14, 3, 18, 9], 'line-opacity': 0.95 } }, 'street-names');
  renderReleve();
}

function setMode(m) {
  mode = m;
  $('tab-mapa').classList.toggle('on', m === 'mapa'); $('tab-rel').classList.toggle('on', m === 'rel');
  $('timebar').hidden = m !== 'mapa';
  $('relev').hidden = !(m === 'rel' && !SV.prompt);
  if (m !== 'rel') $('rvMenu').hidden = true;
  if (popup) popup.remove();
  if (map.getLayer('calles-color')) map.setLayoutProperty('calles-color', 'visibility', m === 'mapa' ? 'visible' : 'none');
  if (map.getLayer('releve-lines')) map.setLayoutProperty('releve-lines', 'visibility', m === 'rel' ? 'visible' : 'none');
  renderInfo();
}
async function startSurvey() {
  SV.active = true; SV.lastI = null; SV.path = 0; SV.speed = 0; SV.last = null; SV.queue = [];
  try { SV.wake = await navigator.wakeLock.request('screen'); } catch {}
  following = true;
  if (meMarker) map.easeTo({ center: meMarker.getLngLat(), zoom: 17 }); else locate(true);
  renderInfo();
}
function stopSurvey() {
  SV.active = false; stopSim();
  try { SV.wake && SV.wake.release(); } catch {} SV.wake = null;
  renderInfo();
}
function densify(c, step) {
  const out = [];
  for (let i = 0; i < c.length - 1; i++) {
    const n = Math.max(1, Math.round(mdist(c[i], c[i + 1]) / step));
    for (let j = 0; j < n; j++) out.push([c[i][0] + (c[i + 1][0] - c[i][0]) * j / n, c[i][1] + (c[i + 1][1] - c[i][1]) * j / n]);
  }
  out.push(c[c.length - 1]);
  return out;
}
function stopSim() { if (SV.sim) { clearInterval(SV.sim); SV.sim = null; } }
function startSim() {   // recorrido falso, para probar sin salir a la calle
  stopSim();
  const c = map.getCenter(), cp = [c.lng, c.lat];
  const g = buildGraph(cp);
  const L = g.lines.filter(l => distToPolyline(cp, l.c) < 200).sort((a, b) => polyLen(b.c) - polyLen(a.c))[0];
  if (!L) { toast('Todavía no cargaron las calles, probá de nuevo'); return; }
  $('rvCompanion').checked = true;
  $('rvMenu').hidden = true;
  if (!SV.active) startSurvey();
  SV.graph = null; SV.lastI = null; SV.last = null;
  const pts = densify(L.c, 6); let i = 0; SV.simT = Date.now();
  if (!meMarker) { const el = document.createElement('div'); el.className = 'me'; meMarker = new maplibregl.Marker({ element: el }).setLngLat(pts[0]).addTo(map); }
  SV.sim = setInterval(() => {
    if (SV.prompt || SV.queue.length) return;
    if (i >= pts.length) { stopSim(); toast('Fin del recorrido simulado'); return; }
    const p = pts[i++]; SV.simT += 4300;
    meMarker.setLngLat(p); map.jumpTo({ center: p, zoom: 17 });
    surveyFix({ longitude: p[0], latitude: p[1], accuracy: 5, speed: 1.4, ts: SV.simT });
  }, 90);
}
function toCsv() {
  const cols = ['ts', 'dia', 'hora', 'calle', 'entre_a', 'entre_b', 'lugares_libres', 'mas_de_6', 'estado', 'desde_lat', 'desde_lng', 'hasta_lat', 'hasta_lng', 'largo_m', 'manual', 'modo'];
  const esc = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + [cols.join(','), ...obs.map(o => cols.map(c => esc(o[c])).join(','))].join('\r\n');
}

// ================= Botones =================
$('tab-mapa').addEventListener('click', () => setMode('mapa'));
$('tab-rel').addEventListener('click', () => setMode('rel'));
$('fab').addEventListener('click', () => { following = true; if (meMarker) map.easeTo({ center: meMarker.getLngLat(), zoom: 17 }); else locate(true); });
$('geoRetry').addEventListener('click', () => { hideGeoHelp(); locate(true); });
$('geoClose').addEventListener('click', hideGeoHelp);
$('rvStart').addEventListener('click', () => SV.active ? stopSurvey() : startSurvey());
$('rvMore').addEventListener('click', () => { $('rvMenu').hidden = !$('rvMenu').hidden; });
$('rvSim').addEventListener('click', startSim);
$('rvManual').addEventListener('click', () => {
  const p = SV.last ? SV.last.p : (meMarker ? meMarker.getLngLat().toArray() : map.getCenter().toArray());
  const A = SV.lastI || { key: 'm0', pt: p, fids: new Set() };
  const B = { key: 'm' + Date.now(), pt: p, fids: new Set() };
  enqueue(A, B, undefined, true);
});
$('rvUndo').addEventListener('click', () => { if (obs.length && confirm('¿Borrar la última cuadra cargada?')) { obs.pop(); saveObs(); renderReleve(); } });
$('rvClear').addEventListener('click', () => { if (obs.length && confirm('¿Borrar TODOS los datos de este teléfono? Exportá el CSV antes.')) { obs = []; saveObs(); renderReleve(); } });
$('rvCsv').addEventListener('click', () => {
  if (!obs.length) { toast('Todavía no hay datos'); return; }
  const blob = new Blob([toCsv()], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'relevamiento-estacionamiento-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
});
$('rvCompanion').addEventListener('change', pumpPrompts);
$('hour').addEventListener('input', () => scheduleColorize(true));
$('day').addEventListener('change', () => scheduleColorize(true));
$('now').addEventListener('click', () => { $('day').value = 'auto'; $('hour').value = new Date().getHours(); scheduleColorize(true); });
$('hour').value = new Date().getHours();
$('hourLabel').textContent = fmtHour(+$('hour').value);
setInterval(() => { if (SV.active) pumpPrompts(); scheduleColorize(true); }, 60 * 1000);
renderInfo();
</script>
